# Render's free plan has no cron. This runs the backend's cleanup jobs every
# hour (expire old posts, delete old OTPs and rejected KYC files).
# Add two repository secrets: API_URL (e.g. https://your-api.onrender.com) and JOB_SECRET.
name: Hourly jobs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/run-jobs
        env:
          API_URL: ${{ secrets.API_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL secret not set, skipping"; exit 0; fi
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 \
            -X POST -H "X-Job-Secret: $JOB_SECRET" "$API_URL/internal/run-jobs"
